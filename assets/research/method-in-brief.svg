<svg xmlns="http://www.w3.org/2000/svg" width="320" height="404" viewBox="0 0 320 404"
     role="img" aria-labelledby="title description">
  <title id="title">GDI decision record and host responsibilities</title>
  <desc id="description">Structured inputs feed a gate classifier. The classifier returns a record and review flags. The host stores the record, obtains required review and enforces its action decision. Outcomes can then be recorded.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8"
            markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 8 4 0 8Z" fill="#514788"/>
    </marker>
  </defs>
  <rect width="320" height="404" rx="8" fill="#faf9fc"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <g fill="#211e31" font-size="20" font-weight="600">
      <rect x="16" y="14" width="288" height="61" rx="6" fill="#eeebff" stroke="#887aca"/>
      <text x="34" y="39">Action, evidence</text>
      <text x="34" y="62">and authority</text>
    </g>
    <path d="M42 75v43" fill="none" stroke="#514788" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="58" y="103" font-size="17" fill="#514788">classifies</text>
    <g fill="#211e31" font-size="20" font-weight="600">
      <rect x="16" y="119" width="288" height="61" rx="6" fill="#eeebff" stroke="#887aca"/>
      <text x="34" y="144">Gate and</text>
      <text x="34" y="167">decision record</text>
    </g>
    <path d="M42 180v43" fill="none" stroke="#514788" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="58" y="208" font-size="17" fill="#514788">returns review flags</text>
    <g fill="#211e31" font-size="20" font-weight="600">
      <rect x="16" y="224" width="288" height="61" rx="6" fill="#eeebff" stroke="#887aca"/>
      <text x="34" y="249">Host storage, review</text>
      <text x="34" y="272">and enforcement</text>
    </g>
    <path d="M42 285v43" fill="none" stroke="#514788" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="58" y="313" font-size="17" fill="#514788">records subsequent result</text>
    <g fill="#211e31" font-size="20" font-weight="600">
      <rect x="16" y="329" width="288" height="61" rx="6" fill="#e4dfff" stroke="#7465bc"/>
      <text x="34" y="354">Action and</text>
      <text x="34" y="377">outcome record</text>
    </g>
  </g>
</svg>
